[project]
name = "effective-broccoli"
version = "0.1.0"
description = ""
authors = [
    { name = "Darthex", email = "mrharshulsharma@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets (>=17.1,<18.0)",
]
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "ruff (>=0.16.8,<0.17.0)"
]

[tool.poetry]
packages = [{ include = "effective_broccoli", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# E/W = flake8 style errors & warnings, F = Pyflakes, I = isort import rules
select = ["E", "W", "F", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"